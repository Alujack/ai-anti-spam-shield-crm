<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1500" viewBox="0 0 820 1500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="5" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
<rect width="820" height="1500" fill="url(#bg)"/><text x="60" y="84" fill="#f8fafc" font-size="50" font-weight="800">Text Preprocessing</text><text x="62" y="128" fill="#94a3b8" font-size="26">Same clean-up for every model, step by step</text><rect x="60" y="150" width="120" height="6" rx="3" fill="url(#accent)"/><g filter="url(#sh)"><rect x="60" y="196" width="700" height="150" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/></g><rect x="60" y="196" width="8" height="150" rx="4" fill="#4f46e5"/><circle cx="122" cy="271" r="34" fill="url(#chip)"/><text x="122" y="284" fill="#ffffff" font-size="36" font-weight="800" text-anchor="middle">1</text><text x="180" y="263" fill="#f8fafc" font-size="32" font-weight="700">Lowercase everything</text><text x="180" y="305" fill="#94a3b8" font-size="23" font-family="DejaVu Sans Mono, monospace">"URGENT! Click" → "urgent! click"</text><path d="M394,345 L410,363 L426,345" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#sh)"><rect x="60" y="360" width="700" height="150" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/></g><rect x="60" y="360" width="8" height="150" rx="4" fill="#4f46e5"/><circle cx="122" cy="435" r="34" fill="url(#chip)"/><text x="122" y="448" fill="#ffffff" font-size="36" font-weight="800" text-anchor="middle">2</text><text x="180" y="427" fill="#f8fafc" font-size="32" font-weight="700">Strip out web links</text><text x="180" y="469" fill="#94a3b8" font-size="23" font-family="DejaVu Sans Mono, monospace">http://spam.link → (removed)</text><path d="M394,509 L410,527 L426,509" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#sh)"><rect x="60" y="524" width="700" height="150" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/></g><rect x="60" y="524" width="8" height="150" rx="4" fill="#4f46e5"/><circle cx="122" cy="599" r="34" fill="url(#chip)"/><text x="122" y="612" fill="#ffffff" font-size="36" font-weight="800" text-anchor="middle">3</text><text x="180" y="591" fill="#f8fafc" font-size="32" font-weight="700">Strip out emails</text><text x="180" y="633" fill="#94a3b8" font-size="23" font-family="DejaVu Sans Mono, monospace">name@scam.com → (removed)</text><path d="M394,673 L410,691 L426,673" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#sh)"><rect x="60" y="688" width="700" height="150" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/></g><rect x="60" y="688" width="8" height="150" rx="4" fill="#4f46e5"/><circle cx="122" cy="763" r="34" fill="url(#chip)"/><text x="122" y="776" fill="#ffffff" font-size="36" font-weight="800" text-anchor="middle">4</text><text x="180" y="755" fill="#f8fafc" font-size="32" font-weight="700">Strip out phone numbers</text><text x="180" y="797" fill="#94a3b8" font-size="23" font-family="DejaVu Sans Mono, monospace">+855 12 345 678 → (removed)</text><path d="M394,837 L410,855 L426,837" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#sh)"><rect x="60" y="852" width="700" height="150" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/></g><rect x="60" y="852" width="8" height="150" rx="4" fill="#4f46e5"/><circle cx="122" cy="927" r="34" fill="url(#chip)"/><text x="122" y="940" fill="#ffffff" font-size="36" font-weight="800" text-anchor="middle">5</text><text x="180" y="919" fill="#f8fafc" font-size="32" font-weight="700">Remove symbols &amp; emojis</text><text x="180" y="961" fill="#94a3b8" font-size="23" font-family="DejaVu Sans Mono, monospace">keep plain letters only</text><path d="M394,1001 L410,1019 L426,1001" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#sh)"><rect x="60" y="1016" width="700" height="150" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/></g><rect x="60" y="1016" width="8" height="150" rx="4" fill="#4f46e5"/><circle cx="122" cy="1091" r="34" fill="url(#chip)"/><text x="122" y="1104" fill="#ffffff" font-size="36" font-weight="800" text-anchor="middle">6</text><text x="180" y="1083" fill="#f8fafc" font-size="32" font-weight="700">Drop common words</text><text x="180" y="1125" fill="#94a3b8" font-size="23" font-family="DejaVu Sans Mono, monospace">the, is, at, which ... gone</text><path d="M394,1165 L410,1183 L426,1165" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#sh)"><rect x="60" y="1180" width="700" height="150" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/></g><rect x="60" y="1180" width="8" height="150" rx="4" fill="#4f46e5"/><circle cx="122" cy="1255" r="34" fill="url(#chip)"/><text x="122" y="1268" fill="#ffffff" font-size="36" font-weight="800" text-anchor="middle">7</text><text x="180" y="1247" fill="#f8fafc" font-size="32" font-weight="700">Stem words to the root</text><text x="180" y="1289" fill="#94a3b8" font-size="23" font-family="DejaVu Sans Mono, monospace">"running", "ran" → "run"</text><path d="M394,1329 L410,1347 L426,1329" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#sh)"><rect x="60" y="1344" width="700" height="120" rx="18" fill="#10b981"/></g><text x="410" y="1396" fill="#06281d" font-size="34" font-weight="800" text-anchor="middle">Clean text, ready for the model</text><text x="410" y="1436" fill="#06281d" font-size="24" text-anchor="middle">fewer noisy tokens -> sharper signal</text></svg>