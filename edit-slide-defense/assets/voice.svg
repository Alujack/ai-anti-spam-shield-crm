<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1496" viewBox="0 0 800 1496" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="5" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
<rect width="800" height="1496" fill="url(#bg)"/><text x="60" y="84" fill="#f8fafc" font-size="50" font-weight="800">Voice Message Check</text><text x="62" y="128" fill="#94a3b8" font-size="26">From an audio clip to a scam / safe answer</text><rect x="60" y="150" width="120" height="6" rx="3" fill="url(#accent)"/><g filter="url(#sh)"><rect x="60" y="196" width="680" height="92" rx="46" fill="#4f46e5"/></g><text x="400" y="252" fill="#ffffff" font-size="30" font-weight="700" text-anchor="middle">Audio in  (WAV / MP3 / OGG)</text><g filter="url(#sh)"><rect x="60" y="340" width="680" height="184" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/></g><rect x="60" y="340" width="8" height="184" rx="4" fill="#4f46e5"/><circle cx="122" cy="432" r="34" fill="url(#chip)"/><text x="122" y="445" fill="#ffffff" font-size="36" font-weight="800" text-anchor="middle">1</text><text x="180" y="424" fill="#f8fafc" font-size="32" font-weight="700">Load the audio</text><text x="180" y="466" fill="#94a3b8" font-size="23" font-family="DejaVu Sans Mono, monospace">PyDub - convert, 16 kHz, mono</text><path d="M384,528 L400,546 L416,528" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#sh)"><rect x="60" y="550" width="680" height="184" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/></g><rect x="60" y="550" width="8" height="184" rx="4" fill="#4f46e5"/><circle cx="122" cy="642" r="34" fill="url(#chip)"/><text x="122" y="655" fill="#ffffff" font-size="36" font-weight="800" text-anchor="middle">2</text><text x="180" y="634" fill="#f8fafc" font-size="32" font-weight="700">Speech to text</text><text x="180" y="676" fill="#94a3b8" font-size="23" font-family="DejaVu Sans Mono, monospace">Google Speech Recognition -&gt; words</text><path d="M384,738 L400,756 L416,738" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#sh)"><rect x="60" y="760" width="680" height="184" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/></g><rect x="60" y="760" width="8" height="184" rx="4" fill="#4f46e5"/><circle cx="122" cy="852" r="34" fill="url(#chip)"/><text x="122" y="865" fill="#ffffff" font-size="36" font-weight="800" text-anchor="middle">3</text><text x="180" y="844" fill="#f8fafc" font-size="32" font-weight="700">Clean the text</text><text x="180" y="886" fill="#94a3b8" font-size="23" font-family="DejaVu Sans Mono, monospace">same 7-step preprocessing</text><path d="M384,948 L400,966 L416,948" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#sh)"><rect x="60" y="970" width="680" height="184" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/></g><rect x="60" y="970" width="8" height="184" rx="4" fill="#7c3aed"/><circle cx="122" cy="1062" r="34" fill="url(#chip)"/><text x="122" y="1075" fill="#ffffff" font-size="36" font-weight="800" text-anchor="middle">4</text><text x="180" y="1054" fill="#f8fafc" font-size="32" font-weight="700">Classify the voice</text><text x="180" y="1096" fill="#94a3b8" font-size="23" font-family="DejaVu Sans Mono, monospace">TF-IDF + Random Forest</text><path d="M384,1158 L400,1176 L416,1158" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="1136" fill="#a78bfa" font-size="21">+ audio tone &amp; prosody signals</text><g filter="url(#sh)"><rect x="60" y="1180" width="680" height="196" rx="18" fill="#273449" stroke="#334155" stroke-width="1.5"/></g><rect x="60" y="1180" width="8" height="196" rx="4" fill="#10b981"/><text x="94" y="1226" fill="#f8fafc" font-size="28" font-weight="800">Result</text><text x="94" y="1266" fill="#cbd5e1" font-size="23" font-family="DejaVu Sans Mono, monospace">transcription: "..."</text><text x="94" y="1296" fill="#cbd5e1" font-size="23" font-family="DejaVu Sans Mono, monospace">is_scam: true / false</text><text x="94" y="1326" fill="#cbd5e1" font-size="23" font-family="DejaVu Sans Mono, monospace">confidence: 0.95</text><text x="94" y="1356" fill="#cbd5e1" font-size="23" font-family="DejaVu Sans Mono, monospace">threat_indicators: [ ... ]</text></svg>