<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gUser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gApi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="gData" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gQueue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="gMl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#cbd5e1"/>
    </marker>
    <marker id="arrowLoop" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5 L0,10 Z" fill="#818cf8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Title -->
  <text x="80" y="92" fill="#f8fafc" font-size="50" font-weight="700">Continuous Learning Loop</text>
  <text x="80" y="138" fill="#94a3b8" font-size="27" font-weight="400">User Feedback &#8594; Automated Model Retraining &#8594; Self-Improving Detection</text>
  <rect x="1530" y="60" width="310" height="58" rx="29" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="1565" cy="89" r="9" fill="#34d399"/>
  <text x="1585" y="98" fill="#cbd5e1" font-size="23" font-weight="600">AI Anti-Spam Shield</text>

  <!-- ===================== STAGE BOXES ===================== -->
  <!-- 1. User / Mobile App -->
  <g filter="url(#shadow)">
    <rect x="70" y="240" width="290" height="250" rx="20" fill="url(#gUser)"/>
  </g>
  <text x="215" y="290" fill="#ffffff" font-size="27" font-weight="700" text-anchor="middle">1 &#183; Mobile App</text>
  <line x1="100" y1="306" x2="330" y2="306" stroke="#082f49" stroke-opacity="0.35" stroke-width="2"/>
  <text x="100" y="345" fill="#ffffff" font-size="20">&#9679; Scans SMS / URL / voice</text>
  <text x="100" y="380" fill="#ffffff" font-size="20">&#9679; Sees prediction result</text>
  <text x="100" y="415" fill="#ffffff" font-size="20">&#9679; Flags wrong calls:</text>
  <text x="122" y="448" fill="#ffffff" font-size="19" font-weight="600">false&#8209;positive / false&#8209;negative</text>
  <text x="122" y="476" fill="#ffffff" font-size="19" font-weight="600">/ confirmed</text>

  <!-- 2. Backend API -->
  <g filter="url(#shadow)">
    <rect x="430" y="240" width="300" height="250" rx="20" fill="url(#gApi)"/>
  </g>
  <text x="580" y="290" fill="#052e16" font-size="27" font-weight="700" text-anchor="middle">2 &#183; Backend API</text>
  <text x="580" y="316" fill="#052e16" font-size="17" text-anchor="middle" font-style="italic">Node.js / Express</text>
  <line x1="460" y1="330" x2="700" y2="330" stroke="#052e16" stroke-opacity="0.35" stroke-width="2"/>
  <text x="460" y="366" fill="#052e16" font-size="19">POST /api/v1/feedback</text>
  <text x="460" y="400" fill="#052e16" font-size="19">Admin review &amp; approve</text>
  <text x="460" y="434" fill="#052e16" font-size="19">Quality scoring (0&#8211;100)</text>
  <text x="460" y="468" fill="#052e16" font-size="19">Threshold check: &#8805; 50</text>

  <!-- 3. Database -->
  <g filter="url(#shadow)">
    <rect x="800" y="240" width="300" height="250" rx="20" fill="url(#gData)"/>
  </g>
  <text x="950" y="290" fill="#451a03" font-size="27" font-weight="700" text-anchor="middle">3 &#183; Database</text>
  <text x="950" y="316" fill="#451a03" font-size="17" text-anchor="middle" font-style="italic">PostgreSQL / Prisma</text>
  <line x1="830" y1="330" x2="1070" y2="330" stroke="#451a03" stroke-opacity="0.35" stroke-width="2"/>
  <text x="830" y="366" fill="#451a03" font-size="19">UserFeedback</text>
  <text x="830" y="400" fill="#451a03" font-size="19">ScanHistory</text>
  <text x="830" y="434" fill="#451a03" font-size="19">ModelVersion</text>
  <text x="830" y="468" fill="#451a03" font-size="17">status &#183; metrics &#183; trainingBatch</text>

  <!-- 4. Queue + Workers -->
  <g filter="url(#shadow)">
    <rect x="1170" y="240" width="300" height="250" rx="20" fill="url(#gQueue)"/>
  </g>
  <text x="1320" y="290" fill="#500724" font-size="27" font-weight="700" text-anchor="middle">4 &#183; Queue + Workers</text>
  <text x="1320" y="316" fill="#500724" font-size="17" text-anchor="middle" font-style="italic">BullMQ / Redis</text>
  <line x1="1200" y1="330" x2="1440" y2="330" stroke="#500724" stroke-opacity="0.35" stroke-width="2"/>
  <text x="1200" y="366" fill="#500724" font-size="19">feedback.worker &#8594; QA</text>
  <text x="1200" y="400" fill="#500724" font-size="19">retraining.worker</text>
  <text x="1200" y="434" fill="#500724" font-size="19">exports approved data</text>
  <text x="1200" y="468" fill="#500724" font-size="19">POST &#8594; /retrain</text>

  <!-- 5. ML Service -->
  <g filter="url(#shadow)">
    <rect x="1540" y="240" width="300" height="250" rx="20" fill="url(#gMl)"/>
  </g>
  <text x="1690" y="290" fill="#2e1065" font-size="27" font-weight="700" text-anchor="middle">5 &#183; ML Service</text>
  <text x="1690" y="316" fill="#2e1065" font-size="17" text-anchor="middle" font-style="italic">Python / FastAPI</text>
  <line x1="1570" y1="330" x2="1810" y2="330" stroke="#2e1065" stroke-opacity="0.35" stroke-width="2"/>
  <text x="1570" y="366" fill="#2e1065" font-size="19">FeedbackCollector</text>
  <text x="1570" y="400" fill="#2e1065" font-size="19">IncrementalTrainer</text>
  <text x="1570" y="434" fill="#2e1065" font-size="19">fine&#8209;tune (LR 1e&#8209;5, 2 ep)</text>
  <text x="1570" y="468" fill="#2e1065" font-size="19">ModelRegistry (versioned)</text>

  <!-- Flow arrows between stages -->
  <line x1="360" y1="365" x2="426" y2="365" stroke="#cbd5e1" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="365" x2="796" y2="365" stroke="#cbd5e1" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="1100" y1="365" x2="1166" y2="365" stroke="#cbd5e1" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="1470" y1="365" x2="1536" y2="365" stroke="#cbd5e1" stroke-width="3.5" marker-end="url(#arrow)"/>

  <!-- ===================== TRAINING / DECISION ROW ===================== -->
  <text x="80" y="610" fill="#f8fafc" font-size="30" font-weight="700">Inside the ML Service &#8594; Gated Deployment</text>

  <!-- Collect -->
  <g filter="url(#shadow)"><rect x="80" y="650" width="250" height="150" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/></g>
  <text x="205" y="700" fill="#e9d5ff" font-size="22" font-weight="700" text-anchor="middle">Collect &amp; Balance</text>
  <text x="205" y="735" fill="#cbd5e1" font-size="18" text-anchor="middle">Quality filter (10&#8211;5000 ch)</text>
  <text x="205" y="765" fill="#cbd5e1" font-size="18" text-anchor="middle">Class balancing</text>

  <!-- Fine-tune -->
  <g filter="url(#shadow)"><rect x="380" y="650" width="250" height="150" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/></g>
  <text x="505" y="700" fill="#e9d5ff" font-size="22" font-weight="700" text-anchor="middle">Fine&#8209;tune Model</text>
  <text x="505" y="735" fill="#cbd5e1" font-size="18" text-anchor="middle">HuggingFace Trainer</text>
  <text x="505" y="765" fill="#cbd5e1" font-size="18" text-anchor="middle">no catastrophic forgetting</text>

  <!-- Evaluate -->
  <g filter="url(#shadow)"><rect x="680" y="650" width="250" height="150" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/></g>
  <text x="805" y="700" fill="#e9d5ff" font-size="22" font-weight="700" text-anchor="middle">Evaluate</text>
  <text x="805" y="735" fill="#cbd5e1" font-size="18" text-anchor="middle">baseline vs new</text>
  <text x="805" y="765" fill="#cbd5e1" font-size="18" text-anchor="middle">recall &#183; F1 gate</text>

  <!-- Decision diamond -->
  <g filter="url(#shadow)">
    <polygon points="1080,650 1190,725 1080,800 970,725" fill="#fbbf24"/>
  </g>
  <text x="1080" y="718" fill="#451a03" font-size="21" font-weight="700" text-anchor="middle">Improved?</text>
  <text x="1080" y="745" fill="#451a03" font-size="16" text-anchor="middle">recall not regressed</text>

  <!-- Deploy (yes) -->
  <g filter="url(#shadow)"><rect x="1280" y="610" width="270" height="110" rx="16" fill="#10b981"/></g>
  <text x="1415" y="655" fill="#052e16" font-size="22" font-weight="700" text-anchor="middle">&#10003; Register + Deploy</text>
  <text x="1415" y="688" fill="#052e16" font-size="18" text-anchor="middle">new version goes live</text>

  <!-- Rollback (no) -->
  <g filter="url(#shadow)"><rect x="1280" y="745" width="270" height="110" rx="16" fill="#ef4444"/></g>
  <text x="1415" y="790" fill="#450a0a" font-size="22" font-weight="700" text-anchor="middle">&#10007; Reject / Rollback</text>
  <text x="1415" y="823" fill="#450a0a" font-size="18" text-anchor="middle">keep current model</text>

  <!-- arrows in training row -->
  <line x1="330" y1="725" x2="376" y2="725" stroke="#cbd5e1" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="725" x2="676" y2="725" stroke="#cbd5e1" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="930" y1="725" x2="966" y2="725" stroke="#cbd5e1" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="1190" y1="690" x2="1276" y2="660" stroke="#34d399" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="1205" y="660" fill="#34d399" font-size="18" font-weight="700">YES</text>
  <line x1="1190" y1="760" x2="1276" y2="790" stroke="#f87171" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="1205" y="800" fill="#f87171" font-size="18" font-weight="700">NO</text>

  <!-- ===================== FEEDBACK LOOP ARROW ===================== -->
  <path d="M1415 720 C 1700 880, 960 1000, 215 1000 C 90 1000, 60 940, 60 870 L 60 500"
        fill="none" stroke="#818cf8" stroke-width="5" stroke-dasharray="2 0" marker-end="url(#arrowLoop)"/>
  <rect x="720" y="965" width="500" height="60" rx="30" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
  <text x="970" y="1003" fill="#c7d2fe" font-size="23" font-weight="700" text-anchor="middle">Improved model serves the next scans &#8594; loop repeats</text>

  <!-- footer note -->
  <text x="1840" y="1045" fill="#475569" font-size="17" text-anchor="end">Trigger: &#8805; 50 approved feedback samples &#183; Weekly scheduler fallback</text>
</svg>
