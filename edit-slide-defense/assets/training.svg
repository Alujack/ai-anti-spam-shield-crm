<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1404" viewBox="0 0 1120 1404" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="5" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
<rect width="1120" height="1404" fill="url(#bg)"/><text x="60" y="84" fill="#f8fafc" font-size="50" font-weight="800">How We Train Each Model</text><text x="62" y="128" fill="#94a3b8" font-size="26">From raw dataset to a saved, ready-to-use model</text><rect x="60" y="150" width="120" height="6" rx="3" fill="url(#accent)"/><g filter="url(#sh)"><rect x="60" y="250" width="320" height="158" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/></g><rect x="60" y="250" width="320" height="8" rx="4" fill="#4f46e5"/><circle cx="110" cy="304" r="28" fill="url(#chip)"/><text x="110" y="315" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">1</text><text x="156" y="312" fill="#f8fafc" font-size="30" font-weight="700">Load dataset</text><text x="88" y="362" fill="#94a3b8" font-size="24">from HuggingFace</text><line x1="380" y1="329" x2="400" y2="329" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/><g filter="url(#sh)"><rect x="400" y="250" width="320" height="158" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/></g><rect x="400" y="250" width="320" height="8" rx="4" fill="#4f46e5"/><circle cx="450" cy="304" r="28" fill="url(#chip)"/><text x="450" y="315" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">2</text><text x="496" y="312" fill="#f8fafc" font-size="30" font-weight="700">Clean the text</text><text x="428" y="362" fill="#94a3b8" font-size="24">7-step preprocessing</text><line x1="720" y1="329" x2="740" y2="329" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/><g filter="url(#sh)"><rect x="740" y="250" width="320" height="158" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/></g><rect x="740" y="250" width="320" height="8" rx="4" fill="#4f46e5"/><circle cx="790" cy="304" r="28" fill="url(#chip)"/><text x="790" y="315" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">3</text><text x="836" y="312" fill="#f8fafc" font-size="30" font-weight="700">Split the data</text><text x="768" y="362" fill="#94a3b8" font-size="24">80% train / 20% test</text><line x1="900" y1="408" x2="900" y2="600" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/><g filter="url(#sh)"><rect x="60" y="600" width="320" height="158" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/></g><rect x="60" y="600" width="320" height="8" rx="4" fill="#7c3aed"/><circle cx="110" cy="654" r="28" fill="url(#chip)"/><text x="110" y="665" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">4</text><text x="156" y="662" fill="#f8fafc" font-size="30" font-weight="700">Build TF-IDF</text><text x="88" y="712" fill="#94a3b8" font-size="24">turn words into numbers</text><line x1="400" y1="679" x2="380" y2="679" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/><g filter="url(#sh)"><rect x="400" y="600" width="320" height="158" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/></g><rect x="400" y="600" width="320" height="8" rx="4" fill="#7c3aed"/><circle cx="450" cy="654" r="28" fill="url(#chip)"/><text x="450" y="665" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">5</text><text x="496" y="662" fill="#f8fafc" font-size="30" font-weight="700">Train classifier</text><text x="428" y="712" fill="#94a3b8" font-size="24">LogReg / Random Forest</text><line x1="740" y1="679" x2="720" y2="679" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/><g filter="url(#sh)"><rect x="740" y="600" width="320" height="158" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/></g><rect x="740" y="600" width="320" height="8" rx="4" fill="#7c3aed"/><circle cx="790" cy="654" r="28" fill="url(#chip)"/><text x="790" y="665" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">6</text><text x="836" y="662" fill="#f8fafc" font-size="30" font-weight="700">Evaluate</text><text x="768" y="712" fill="#94a3b8" font-size="24">score on the held-out 20%</text><line x1="220" y1="758" x2="220" y2="960" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/><g filter="url(#sh)"><rect x="60" y="960" width="1000" height="250" rx="20" fill="url(#chip)"/></g><text x="560" y="1018" fill="#fff" font-size="34" font-weight="800" text-anchor="middle">Save the trained model</text><g filter="url(#sh)"><rect x="110" y="1056" width="280" height="116" rx="14" fill="#ffffff"/></g><text x="250" y="1106" fill="#4f46e5" font-size="26" font-weight="800" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">classifier.pkl</text><text x="250" y="1144" fill="#475569" font-size="22" text-anchor="middle">the model itself</text><g filter="url(#sh)"><rect x="440" y="1056" width="280" height="116" rx="14" fill="#ffffff"/></g><text x="580" y="1106" fill="#4f46e5" font-size="26" font-weight="800" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">vectorizer.pkl</text><text x="580" y="1144" fill="#475569" font-size="22" text-anchor="middle">word → number map</text><g filter="url(#sh)"><rect x="770" y="1056" width="280" height="116" rx="14" fill="#ffffff"/></g><text x="910" y="1106" fill="#4f46e5" font-size="26" font-weight="800" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">metadata.json</text><text x="910" y="1144" fill="#475569" font-size="22" text-anchor="middle">scores &amp; settings</text><text x="60" y="1272" fill="#94a3b8" font-size="24">Same recipe for all three models — only the algorithm and dataset change.</text></svg>