# ============================================================
# CONTINUOUS DEPLOYMENT (CD) PIPELINE
# ============================================================
# This workflow runs when:
#   - Code is pushed/merged to main branch
#   - Manually triggered via GitHub UI (workflow_dispatch)
#
# Deploys by SSHing to the server, pulling latest code,
# and rebuilding Docker images directly on the server.
#
# IMPORTANT: Configure these secrets in GitHub:
#   - DROPLET_IP: Your DigitalOcean server IP
#   - DROPLET_USER: SSH username (usually 'root')
#   - DROPLET_SSH_KEY: Private SSH key for authentication
#   - DOMAIN: Your domain name (e.g., aiscamshield.codes)
# ============================================================

name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip CI tests (use with caution!)'
        required: false
        default: 'false'
        type: boolean

# Prevent concurrent deployments
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # JOB 1: RUN CI TESTS FIRST
  # ============================================================
  ci-check:
    name: Run CI Tests
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    uses: ./.github/workflows/ci.yml

  # ============================================================
  # JOB 2: DEPLOY TO DIGITALOCEAN
  # ============================================================
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: [ci-check]
    if: always() && (needs.ci-check.result == 'success' || needs.ci-check.result == 'skipped')
    environment: production
    permissions:
      contents: write  # Needed to push the 'deployed' tag

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            echo "====================================="
            echo "  AI Anti-Spam Shield Deployment"
            echo "  $(date)"
            echo "====================================="

            # Navigate to project directory
            PROJECT_DIR="/root/ai-anti-spam-shield-crm"
            cd $PROJECT_DIR || { echo "Project directory not found!"; exit 1; }

            # Pull latest code
            echo "[1/4] Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # Stop current services
            echo "[2/4] Stopping current services..."
            docker compose -f deploy/digitalocean/docker-compose.prod.yml down --timeout 30

            # Rebuild and start services
            echo "[3/4] Building and starting services..."
            docker compose -f deploy/digitalocean/docker-compose.prod.yml up -d --build

            # Wait for services to be healthy
            echo "[4/4] Waiting for services to be healthy..."
            sleep 30

            echo ""
            echo "====================================="
            echo "       DEPLOYMENT COMPLETE           "
            echo "====================================="
            docker compose -f deploy/digitalocean/docker-compose.prod.yml ps
            echo "====================================="

      # Verify deployment with health check
      - name: Health Check
        run: |
          echo "Verifying deployment..."
          sleep 15

          max_attempts=5
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "Health check attempt $attempt/$max_attempts..."

            response=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 10 \
              --max-time 30 \
              "https://${{ secrets.DOMAIN }}/health" 2>/dev/null || echo "000")

            if [ "$response" = "200" ]; then
              echo "Health check PASSED!"
              echo "Deployment successful!"

              # Tag this commit as successfully deployed
              git tag -f deployed HEAD
              git push -f origin deployed || true

              exit 0
            fi

            echo "Got HTTP $response, retrying in 15s..."
            attempt=$((attempt + 1))
            sleep 15
          done

          echo "Health check FAILED after $max_attempts attempts"
          exit 1

      # Automatic rollback on failure
      - name: Rollback on Failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            echo "====================================="
            echo "      ROLLBACK INITIATED             "
            echo "====================================="

            cd /root/ai-anti-spam-shield-crm

            # Go back to previous commit
            git checkout HEAD~1

            # Restart with previous version
            docker compose -f deploy/digitalocean/docker-compose.prod.yml down
            docker compose -f deploy/digitalocean/docker-compose.prod.yml up -d --build

            echo "====================================="
            echo "       ROLLBACK COMPLETE             "
            echo "====================================="

  # ============================================================
  # JOB 3: POST-DEPLOYMENT NOTIFICATIONS
  # ============================================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Deployment Success
        if: needs.deploy.result == 'success'
        run: |
          echo "====================================="
          echo "     DEPLOYMENT SUCCESSFUL!          "
          echo "====================================="
          echo ""
          echo "Version: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Deployed by: ${{ github.actor }}"
          echo "Time: $(date)"
          echo "====================================="

      - name: Deployment Failed
        if: needs.deploy.result == 'failure'
        run: |
          echo "====================================="
          echo "      DEPLOYMENT FAILED!             "
          echo "====================================="
          echo ""
          echo "Version: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Attempted by: ${{ github.actor }}"
          echo "Time: $(date)"
          echo ""
          echo "Please check the logs and fix the issue."
          echo "Automatic rollback may have been triggered."
          echo "====================================="
