<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Cancelled — AI Scam Shield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F8F9FC; padding: 24px; }
    .card { background: white; border-radius: 24px; padding: 60px 48px; text-align: center; max-width: 480px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
    .icon { width: 80px; height: 80px; background: #FFF0F0; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 36px; }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 12px; color: #1A1A2E; }
    p { font-size: 16px; color: #6B7280; line-height: 1.6; margin-bottom: 32px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-block; padding: 14px 36px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 15px; transition: all 0.2s; }
    .btn-primary { background: #6C5CE7; color: white; }
    .btn-primary:hover { background: #5A4BD1; }
    .btn-outline { background: transparent; color: #6C5CE7; border: 2px solid #6C5CE7; }
    .btn-outline:hover { background: #6C5CE7; color: white; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#10007;</div>
    <h1>Payment Cancelled</h1>
    <p>No worries — you haven't been charged. You can try again anytime or continue with the free plan.</p>
    <div class="actions">
      <a href="/#pricing" class="btn btn-primary">Try Again</a>
      <a href="/" class="btn btn-outline">Back to Home</a>
    </div>
  </div>
</body>
</html>
